name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Build all packages (libraries, services, frontend)
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

  docker-integration:
    name: Docker build & integration test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          echo "MYSQL_ROOT_PASSWORD=ci-root-password" >> .env
          echo "JWT_SECRET=ci-jwt-secret-$(openssl rand -hex 16)" >> .env

      - name: Build images
        run: docker compose build

      - name: Start the system
        run: docker compose up -d

      - name: Wait for the gateway and log in as the demo admin
        run: |
          for i in $(seq 1 40); do
            status=$(curl -s -o response.json -w "%{http_code}" -X POST http://localhost:3000/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@demo.com","password":"Admin1234!"}' || true)
            if [ "$status" = "200" ]; then
              echo "Login succeeded"
              exit 0
            fi
            echo "Attempt $i: status $status, waiting..."
            sleep 5
          done
          echo "Gateway did not become ready"
          exit 1

      - name: Check vacations API with the token
        run: |
          token=$(jq -r '.data.token' response.json)
          count=$(curl -s -H "Authorization: Bearer $token" http://localhost:3000/api/vacations | jq '.data | length')
          echo "Vacations returned: $count"
          test "$count" -gt 0

      - name: Check the frontend is served
        run: curl -sf http://localhost/ | grep -qi "<div id=\"root\">"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the system
        if: always()
        run: docker compose down -v

  publish:
    name: Push images to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        include:
          - image: vacastream-auth
            dockerfile: Backend/Dockerfile
            build-args: SERVICE=Auth
          - image: vacastream-vacation
            dockerfile: Backend/Dockerfile
            build-args: SERVICE=Vacation
          - image: vacastream-gateway
            dockerfile: Backend/Dockerfile
            build-args: SERVICE=Gateway
          - image: vacastream-frontend
            dockerfile: Frontend/web-app/Dockerfile
            build-args: VITE_API_URL=http://localhost:3000
    steps:
      - name: Skip when Docker Hub secrets are not set
        if: env.DOCKERHUB_USERNAME == ''
        run: echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not set - skipping the push."

      - uses: actions/checkout@v4
        if: env.DOCKERHUB_USERNAME != ''

      - uses: docker/setup-buildx-action@v3
        if: env.DOCKERHUB_USERNAME != ''

      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
